name: firebase_auth_flutter_ddd
description: Firebase authentication example with Hooks Riverpod and Freezed following Flutter DDD architecture



publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: '>=3.2.3 <4.0.0'

dependencies:
    cupertino_icons: ^1.0.9
    firebase_auth: ^6.5.4
    firebase_core: ^4.11.0
    flutter:
        sdk: flutter
    flutter_hooks: ^0.21.3+1
    fpdart: ^1.2.0
    freezed_annotation: ^3.1.0
    hooks_riverpod: ^3.3.2

dev_dependencies:
    build_runner: ^2.15.0
    flutter_lints: ^6.0.0
    flutter_test:
        sdk: flutter
    freezed: ^3.2.5

flutter:
    uses-material-design: true
